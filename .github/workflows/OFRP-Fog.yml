name: OFRP - Redmi Fog

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/dp02xd/device_xiaomi_fog-TWRP'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'ofrp-12'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/xiaomi/fog'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'fog'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      KERNEL_TREE:
        description: 'Kernel Source Tree'
        required: false
        default: 'https://github.com/Redmi-Fog/kernel_xiaomi_sm6225'
      KERNEL_PATH:
        description: 'Specify your Kernel path'
        required: false
        default: 'kernel/xiaomi/fog'
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "ツ๛abrohim๛"
        git config --global user.email "callofduty.pubg786@gmail.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Build Custom Kernel
      if: github.event.inputs.BUILD_TARGET == 'boot'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        mkdir -p ${{ github.event.inputs.KERNEL_PATH }}
        git clone ${{ github.event.inputs.KERNEL_TREE }} ${{ github.event.inputs.KERNEL_PATH }}
        cd ${{ github.event.inputs.KERNEL_PATH }}
        chmod +x build.sh
        echo -e "\nRunning kernel build script..."
        ./build.sh
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "Kernel compiled successfully!"
        else
          echo "Kernel build failed! Image.gz not found in out directory."
          exit 1
        fi

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_VANILLA_BUILD=1
        export OF_MANUAL_ROOT_VENDOR_ERROR_FIX=1
        set -e
        
        BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        TARGET="${{ github.event.inputs.BUILD_TARGET }}"
        DEVICE="${{ github.event.inputs.DEVICE_NAME }}"
        
        case "$BRANCH" in
          "11.0"|"12.1")
            LUNCH_TARGET="twrp_${DEVICE}-eng"
            ;;
          "14.1")
            LUNCH_TARGET="twrp_${DEVICE}-ap2a-eng"
            ;;
          *)
            LUNCH_TARGET="omni_${DEVICE}-eng"
            ;;
        esac
        
        case "$TARGET" in
          "boot")
            BUILD_GOAL="bootimage"
            ;;
          "recovery")
            BUILD_GOAL="recoveryimage"
            ;;
          "vendorboot")
            BUILD_GOAL="vendorbootimage"
            ;;
        esac
        
        lunch ${LUNCH_TARGET}
        make clean
        mka adbd ${BUILD_GOAL}

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        TARGET_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        
        if compgen -G "${TARGET_DIR}/OrangeFox*.img" > /dev/null; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/${TARGET_DIR}" >> $GITHUB_ENV
            IMG_FILE=$(ls ${TARGET_DIR}/OrangeFox*.img | head -n 1)
            echo "MD5_IMG=$(md5sum ${IMG_FILE} | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "::error::Recovery target binary missing from ${TARGET_DIR}"
            exit 1
        fi

    - name: Rename the Recovery
      if: env.CHECK_IMG_IS_OK == 'true'
      run: |
        cd ${{ env.FILE_PATH }}/
        TARGET_IMG=$(ls OrangeFox*.img | head -n 1)
        
        if [ "${{ github.event.inputs.BUILD_TARGET }}" = "boot" ]; then
          mv "${TARGET_IMG}" boot.img
          echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
        elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "recovery" ]; then
          mv "${TARGET_IMG}" recovery.img
          echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
        elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ]; then
          mv "${TARGET_IMG}" vendor_boot.img
          echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
        fi

    - name: Include Recovery Installer
      if: env.CHECK_IMG_IS_OK == 'true' && github.event.inputs.RECOVERY_INSTALLER == 'true'
      run: |
        cd ${{ env.FILE_PATH }}/
        wget https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
        zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
      continue-on-error: true

    - name: Combined Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
          ${{ env.FILE_PATH }}/recovery-installer.zip
          ${{ env.FILE_PATH }}/OrangeFox*.zip
          ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          ${{ env.FILE_PATH }}/ramdisk-recovery.*
        fail_on_unmatched_files: false
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Target: ${{ env.RECOVERY_TYPE }}.img
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}

    - name: Run LDCheck (Optional)
      if: env.CHECK_IMG_IS_OK == 'true'
      run: |
        echo "LDCheck is currently disabled due to path issues"
        echo "The specified binary '${{ github.event.inputs.LDCHECK }}' was not found in the built recovery"
        echo "This step is informational only and doesn't affect the build"
      continue-on-error: true
